services:
  # Redis Cache - Shared across all services
  redis:
    image: redis:7-alpine
    container_name: yield-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Neo4j Knowledge Graph - RAG and Reputation Layer
  neo4j:
    image: neo4j:5-community
    container_name: yield-agent-neo4j
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/yield-agent-dev}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_server_memory_heap_initial__size=512M
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=256M
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # PostgreSQL - TradFi Blotter & Backoffice
  postgres:
    image: postgres:16-alpine
    container_name: yield-agent-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pricing_engine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pricing_engine_kb}
      POSTGRES_DB: ${POSTGRES_DB:-blotter}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricing_engine -d blotter"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Gateway - Circle WDK & Agent Orchestration Hub
  gateway-wdk:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    container_name: yield-agent-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AI_CORE_GRPC_URL=ai-core:50051
      - AI_CORE_HTTP_URL=http://ai-core:8000
      - TRANSACT_API_URL=http://ai-core:8000
      - NEO4J_URI=bolt://neo4j:7687
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://pricing_engine:pricing_engine_kb@postgres:5432/blotter
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # AI Core + Transact Gateway (Unified)
  ai-core:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ai-core-unified
    container_name: yield-agent-ai-core
    ports:
      - "50051:50051"
      - "8000:8000"
    volumes:
      - ../ai-core:/app/ai-core
      - ../psychic-invention:/app/psychic-invention
      - ./start_ai_core_unified.sh:/app/start_ai_core_unified.sh
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-yield-agent-dev}
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://pricing_engine:pricing_engine_kb@postgres:5432/blotter
      - GATEWAY_URL=http://gateway-wdk:3000
      - PYTHONPATH=/app/ai-core:/app/psychic-invention
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import grpc; print('ok')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # LangGraph Orchestrator
  orchestrator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ai-core-unified
    container_name: yield-agent-orchestrator
    ports:
      - "8001:8001"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-yield-agent-dev}
      - REDIS_URL=redis://redis:6379
      - KRAKEN_GATEWAY_URL=http://gateway-wdk:3000/api/kraken
      - ORCHESTRATOR_PORT=8001
    command: ["python", "-m", "ai_core.orchestrator.server"]
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      gateway-wdk:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Frontend UI
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        - VITE_GATEWAY_URL=http://localhost:3000
        - VITE_WS_URL=ws://localhost:3000
        - VITE_API_URL=http://localhost:3000/api/transact
    container_name: yield-agent-frontend
    ports:
      - "5173:80"
    depends_on:
      - gateway-wdk
    restart: unless-stopped

  # Graph Seeder
  graph-seeder:
    image: neo4j:5-community
    container_name: yield-agent-graph-seeder
    entrypoint: ["/bin/bash", "/scripts/seed_graph.sh"]
    volumes:
      - ../ai-core/scripts:/scripts:ro
      - ../ai-core/cypher:/cypher:ro
    environment:
      - NEO4J_BOLT_URL=bolt://neo4j:7687
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/yield-agent-dev}
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "no"

  # Indexer
  indexer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.indexer
    container_name: yield-agent-indexer
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-yield-agent-dev}
      - REDIS_URL=redis://redis:6379
      - RPC_URL_ETHEREUM=${RPC_URL_ETHEREUM:-https://eth.llamarpc.com}
      - RPC_URL_SEPOLIA=${RPC_URL_SEPOLIA:-https://rpc.sepolia.org}
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: on-failure

volumes:
  neo4j_data:
  neo4j_logs:
  redis_data:
  postgres_data:
